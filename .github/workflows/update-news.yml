name: Update TTM/Wellness News

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        run: python scraper.py

      - name: Commit and push if news.json changed
        run: |
          git config user.name "sasuk-news-bot"
          git config user.email "actions@github.com"
          git add news.json
          if git diff --cached --quiet; then
            echo "ไม่มีข่าวใหม่ ไม่ต้อง commit"
          else
            git commit -m "chore: update news.json [automated]"
            git push
          fi
